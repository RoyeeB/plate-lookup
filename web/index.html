<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4C400" />
    <script>
      // Apply the colour theme before first paint (no light flash on a dark
      // page). Mirrors resolveTheme() in src/lib/theme.ts.
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('plate-lookup:theme') || 'system';
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0f1115' : '#F4C400';
      })();
    </script>
    <meta
      name="description"
      content="איתור פרטי רכב לפי מספר לוחית רישוי מתוך מרשם הרכב של משרד התחבורה (data.gov.il)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>איתור לוחית — פרטי רכב לפי מספר רישוי</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
